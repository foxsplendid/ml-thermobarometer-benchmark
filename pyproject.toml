[project]
name = "ml-thermobarometer-benchmark"
version = "7.3.0"
description = "Reproducible clinopyroxene thermobarometer benchmark environment"
requires-python = "==3.12.*"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.7.2",
    "catboost==1.2.3",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "shap==0.46.0",
    "pyarrow==16.1.0",
    "joblib==1.4.2",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-cov>=4.0",
]

[tool.uv]
package = false
required-version = "==0.11.16"
python-preference = "only-managed"
